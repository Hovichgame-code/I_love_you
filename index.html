<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#020104;--ink:#fff4de;--halo:rgba(120,22,0,.85);--glow:rgba(255,80,0,.75);--glow2:rgba(255,110,10,.9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020104;--ink:#fff4de}}
:root[data-theme="dark"]{--bg:#020104;--ink:#fff4de}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{inset:auto;width:auto;height:auto}
#t{position:fixed;left:50%;top:50%;margin:0;transform:translate(-50%,-50%);font-family:"Great Vibes","Snell Roundhand","Brush Script MT",cursive;font-weight:400;font-size:18vw;line-height:1;color:var(--ink);white-space:nowrap;pointer-events:none;user-select:none;opacity:0;
text-shadow:0 0 .05em var(--halo),0 0 .16em var(--halo),0 0 .4em var(--glow),0 .02em .04em rgba(40,0,0,.8)}
#t.on{animation:rise 2.8s ease-out forwards,breathe 4.5s 2.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;filter:blur(14px);letter-spacing:.14em}to{opacity:1;filter:blur(0);letter-spacing:.02em}}
@keyframes breathe{50%{text-shadow:0 0 .06em var(--halo),0 0 .2em var(--halo),0 0 .6em var(--glow2),0 .02em .04em rgba(40,0,0,.8)}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="glow"></canvas>
<canvas id="gl"></canvas>
<canvas id="emb"></canvas>
<h1 id="t">I love you</h1>
<script>
(()=>{
const sky=document.getElementById('sky'),glw=document.getElementById('glow'),glc=document.getElementById('gl'),emc=document.getElementById('emb'),txt=document.getElementById('t');
const sx=sky.getContext('2d'),gx=glw.getContext('2d'),ex=emc.getContext('2d');
const R=Math.random,TAU=Math.PI*2;
let W,H,dpr,S,hx,hy,tw=[],emb=[],time=0;

/* ---------- fire shader: crisp heart-shaped flame ---------- */
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform vec2 R;uniform float T,B;
float hs(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+1.),f.x),f.y);}
float fb(vec2 p,int n){float s=0.,a=.5;for(int i=0;i<4;i++){if(i>=n)break;s+=a*nz(p);p=mat2(1.6,1.2,-1.2,1.6)*p+7.3;a*=.5;}return s/(1.-exp2(-float(n)));}
float d2(vec2 v){return dot(v,v);}
float sdh(vec2 p){p.x=abs(p.x);if(p.y+p.x>1.)return sqrt(d2(p-vec2(.25,.75)))-.35355;return sqrt(min(d2(p-vec2(0.,1.)),d2(p-.5*max(p.x+p.y,0.))))*sign(p.x-p.y);}
void main(){
  vec2 uv=gl_FragCoord.xy/R;
  vec2 P=vec2((uv.x-.5)*2.5,-1.15+uv.y*2.7)/(1.+B);
  float t=T;
  float sd=sdh(P*.604+vec2(0.,.552))/.604;
  float w=sin(P.y*3.+t*1.7)*.12+sin(P.y*7.-t*2.9)*.05;
  float a=fb(vec2((P.x+w)*3.2,P.y*2.1-t*1.5)+fb(P*1.6+vec2(0.,-t*.6),3)*1.3,4);
  float b=fb(P*8.-vec2(0.,t*2.6)+a,3);
  float s=fb(vec2((P.x+w)*5.5,P.y*1.1-t*2.2),4);
  float uph=smoothstep(.65,1.,P.y);
  float fi=-sd*6.5+(a-.5)*.6+(b-.5)*.25;
  float tg=(smoothstep(.38,.8,s)*(.6+.5*a)*mix(.2,1.,smoothstep(.08,.5,abs(P.x)))-max(sd,0.)*4.5)*uph;
  float fd=max(fi,tg);
  float hc=.2+clamp(-sd,0.,.6)*.7+(a-.5)*2.2+(b-.5)*1.5;
  float hh=mix(tg*.85+(b-.5)*.4,hc,step(tg,fi));
  vec3 c=vec3(.35,.02,0.);
  c=mix(c,vec3(.95,.12,0.),smoothstep(0.,.25,hh));
  c=mix(c,vec3(1.,.45,.03),smoothstep(.2,.65,hh));
  c=mix(c,vec3(1.,.78,.2),smoothstep(.6,1.1,hh));
  c=mix(c,vec3(1.,.97,.75),smoothstep(1.05,1.6,hh));
  c*=.55+.6*smoothstep(.3,.6,a);
  c+=vec3(.5,.35,.1)*smoothstep(.72,.9,b)*.6;
  c*=1.+B*3.;
  c+=vec3(.4,.16,.02)*(1.-smoothstep(0.,.09,abs(sd+.045)));
  float al=smoothstep(0.,.045,fd)*smoothstep(0.,.05,min(min(uv.x,1.-uv.x),min(uv.y,1.-uv.y)));
  gl_FragColor=vec4(c*al,al);
}`;
const gl=glc.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false})||glc.getContext('experimental-webgl');
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T'),uB=gl.getUniformLocation(pr,'B');
gl.clearColor(0,0,0,0);

/* ---------- embers ---------- */
const hp=t=>[Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16];
function es(k,first){
  const o=hp((R()*2-1)*2.4),m=.55+R()*.4;
  k.x=o[0]*m;k.y=(o[1]-.156)*m;k.vx=(R()-.5)*.2;k.vy=-(.2+R()*.55);
  k.life=1.5+R()*2.5;k.age=first?R()*k.life:0;k.sz=.7+R()*1.5;k.ph=R()*TAU;
}

/* ---------- starry sky ---------- */
function drawSky(){
  sx.setTransform(dpr,0,0,dpr,0,0);
  sx.fillStyle='#020104';sx.fillRect(0,0,W,H);
  [[.2,.25,.55,'38,22,70'],[.8,.7,.6,'60,20,40'],[.5,.5,.9,'20,24,52']].forEach(([a,b,r,col])=>{
    const g=sx.createRadialGradient(W*a,H*b,0,W*a,H*b,Math.max(W,H)*r);
    g.addColorStop(0,`rgba(${col},.2)`);g.addColorStop(1,`rgba(${col},0)`);sx.fillStyle=g;sx.fillRect(0,0,W,H);
  });
  const tints=['255,255,255','200,215,255','255,228,205','255,255,255'],n=Math.round(W*H/1400);
  for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H,m=R()**4,r=.25+m*1.2,a=.12+R()**2*.75+m*.3,col=tints[(R()*4)|0];
    if(r>1){const g=sx.createRadialGradient(x,y,0,x,y,r*5);g.addColorStop(0,`rgba(${col},${a*.35})`);g.addColorStop(1,`rgba(${col},0)`);sx.fillStyle=g;sx.fillRect(x-r*5,y-r*5,r*10,r*10)}
    sx.fillStyle=`rgba(${col},${Math.min(a,1)})`;sx.beginPath();sx.arc(x,y,r,0,TAU);sx.fill();
  }
}

function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.75);
  for(const cv of [sky,glw,emc]){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  S=Math.min(W*.42,H*.34);hx=W/2;hy=H/2+.08*S;
  const bw=2.5*S,bh=2.7*S,gd=Math.min(devicePixelRatio||1,Math.sqrt((S<260?1.2e6:1.8e6)/(bw*bh)));
  Object.assign(glc.style,{left:hx-bw/2+'px',top:hy-1.55*S+'px',width:bw+'px',height:bh+'px'});
  glc.width=Math.round(bw*gd);glc.height=Math.round(bh*gd);
  gl.viewport(0,0,glc.width,glc.height);gl.uniform2f(uR,glc.width,glc.height);
  emb=Array.from({length:S<260?50:90},()=>{const k={};es(k,true);return k});
  const tn=Math.max(40,Math.min(160,Math.round(W*H/9000)));
  tw=Array.from({length:tn},(_,i)=>({x:R()*W,y:R()*H,r:.5+R()*.9,a:.35+R()*.65,sp:.8+R()*2.5,ph:R()*TAU,big:i%9===0,c:R()<.3?'255,225,200':'225,235,255'}));
  txt.style.left=hx+'px';txt.style.top=(hy-.02*S)+'px';txt.style.fontSize=(S*.34)+'px';
  drawSky();
}

let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
  const ph=(time%1.7)/1.7;
  const beat=.035*Math.exp(-(((ph-.08)/.05)**2))+.022*Math.exp(-(((ph-.24)/.06)**2));
  const s=S*(1+beat);

  /* twinkling stars + sun-like halo (behind the fire) */
  gx.setTransform(1,0,0,1,0,0);gx.clearRect(0,0,glw.width,glw.height);
  gx.setTransform(dpr,0,0,dpr,0,0);gx.globalCompositeOperation='lighter';
  for(const q of tw){
    const f=.55+.45*Math.sin(time*q.sp+q.ph),a=q.a*f;
    gx.fillStyle=`rgba(${q.c},${a})`;gx.beginPath();gx.arc(q.x,q.y,q.r,0,TAU);gx.fill();
    if(q.big){const L=(5+q.r*6)*f;gx.strokeStyle=`rgba(${q.c},${a*.8})`;gx.lineWidth=.8;gx.beginPath();gx.moveTo(q.x-L,q.y);gx.lineTo(q.x+L,q.y);gx.moveTo(q.x,q.y-L);gx.lineTo(q.x,q.y+L);gx.stroke()}
  }
  const gr=gx.createRadialGradient(hx,hy,0,hx,hy,s*2.1);
  gr.addColorStop(0,`rgba(255,110,20,${.45+beat*3})`);gr.addColorStop(.3,'rgba(220,60,5,.3)');
  gr.addColorStop(.6,'rgba(110,20,0,.12)');gr.addColorStop(1,'rgba(0,0,0,0)');
  gx.fillStyle=gr;gx.fillRect(0,0,W,H);

  /* the fire */
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(uT,time);gl.uniform1f(uB,beat);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  /* sparks in front */
  ex.setTransform(1,0,0,1,0,0);ex.clearRect(0,0,emc.width,emc.height);
  ex.setTransform(dpr,0,0,dpr,0,0);ex.globalCompositeOperation='lighter';
  for(const k of emb){
    k.age+=dt;if(k.age>=k.life){es(k);continue}
    k.x+=(k.vx+Math.sin(time*3+k.ph)*.1)*dt;k.y+=k.vy*dt;
    const u=k.age/k.life,a=(1-u)*(.65+.35*Math.sin(time*18+k.ph)),X=hx+k.x*s,Y=hy+k.y*s,r=k.sz*(1+S/500);
    ex.fillStyle=`rgba(255,${(235-150*u)|0},${(120-100*u)|0},${a})`;ex.beginPath();ex.arc(X,Y,r,0,TAU);ex.fill();
    ex.fillStyle=`rgba(255,110,20,${a*.22})`;ex.beginPath();ex.arc(X,Y,r*3,0,TAU);ex.fill();
  }
  requestAnimationFrame(frame);
}

resize();addEventListener('resize',resize);
Promise.race([document.fonts?document.fonts.load('1em "Great Vibes"'):0,new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>txt.classList.add('on'));
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
